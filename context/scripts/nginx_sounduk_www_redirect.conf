# Apex → www so Origin matches Selectel S3 CORS (https://www.sounduk.ru).
# HTTPS cert is the same Let's Encrypt name covering both hosts.

server {
    listen 443 ssl;
    server_name sounduk.ru;
    ssl_certificate /etc/letsencrypt/live/sounduk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sounduk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.sounduk.ru$request_uri;
}

server {
    server_name www.sounduk.ru;
    root /var/www/sounduk;
    index index.html;

    # ─── Legal documents ──────────────────────────────────────────
    location ~ ^/(en/)?(privacy|terms|consent|delete-account)(\.html)?$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        try_files $uri $uri.html =404;
    }

    location = /robots.txt  { try_files /robots.txt =404; }
    location = /sitemap.xml { try_files /sitemap.xml =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* (?:index\.html|main\.dart\.js|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location ~* \.(?:ico|gif|jpe?g|png|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/sounduk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sounduk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name sounduk.ru;
    return 301 https://www.sounduk.ru$request_uri;
}

server {
    listen 80;
    server_name www.sounduk.ru;
    return 301 https://www.sounduk.ru$request_uri;
}
